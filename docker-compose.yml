# Vigicom - stack local de desarrollo
# Cada app PHP es un servicio separado (mismo Dockerfile, distinto bind y puerto).
# Para agregar una nueva app, copiar el bloque "cloud" cambiando puerto + volume.
#
# La base MySQL no vive en este compose: se usa el contenedor compartido
# `herramientas-mysql` (stack `herramientas`), accesible desde los contenedores
# de esta stack via `host.docker.internal:3306`. Base: `vigicom_dev`.

name: vigicom

services:
  cloud:
    build:
      context: ./docker/php
    container_name: vigicom-apache
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8090:8090"   # cloud  -> /var/www/cloud
      - "8104:8104"   # api    -> /var/www/api
      - "8105:8105"   # robot  -> /var/www/robot
      - "8106:8106"   # www    -> /var/www/www
      - "8107:8107"   # app    -> /var/www/app
      - "8108:8108"   # panel  -> /var/www/panel
    volumes:
      - ./cloud:/var/www/cloud
      - ./api:/var/www/api
      - ./robot:/var/www/robot
      - ./www:/var/www/www
      - ./app:/var/www/app
      - ./panel:/var/www/panel
      - ./db:/var/www/db
      - ./env.php:/var/www/env.php
      - ./.env.development:/var/www/.env.development
      - ./.env.production:/var/www/.env.production
    environment:
      APP_URL: http://localhost:8090

  emqx:
    image: emqx/emqx:5.8
    container_name: vigicom-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"     # MQTT dev (en prod el compose generado mapea 16273:1883)
      - "18083:18083"   # dashboard (filtrado por IP en el security group)
    env_file:
      - .env.development
    environment:
      EMQX_ALLOW_ANONYMOUS: "false"
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__USER_ID_TYPE: username
    volumes:
      - vigicom_emqx_data:/opt/emqx/data
      - ./docker/emqx/init.sh:/init.sh:ro
    entrypoint: ["/init.sh"]
    command: ["/opt/emqx/bin/emqx", "foreground"]

volumes:
  vigicom_emqx_data:
