# Vigicom - stack local de desarrollo
# Cada app PHP es un servicio separado (mismo Dockerfile, distinto bind y puerto).
# Para agregar una nueva app, copiar el bloque "cloud" cambiando puerto + volume.

name: vigicom

services:
  db:
    image: mysql:8.0
    container_name: vigicom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: vigicom_dev
    ports:
      - "3310:3306"
    volumes:
      - vigicom_dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 30

  cloud:
    build:
      context: ./docker/php
    container_name: vigicom-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8090:80"
    volumes:
      - ./cloud:/var/www/html
      - ./api:/var/www/api
      - ./db:/var/www/db
      - ./.env.development:/var/www/.env.development
      - ./.env.production:/var/www/.env.production
    environment:
      APP_ENV: dev
      APP_URL: http://localhost:8090
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: vigicom_dev
      DB_USER: root
      DB_PASS: root

volumes:
  vigicom_dbdata:
