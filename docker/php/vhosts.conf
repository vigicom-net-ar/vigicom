# Vhosts del contenedor vigicom-apache. La routing es POR PUERTO (no por Host
# header): cada vhost esta atado a un puerto distinto, mismo numero adentro
# y afuera del contenedor, y mismo numero entre dev y prod.
#
#   8090 -> /var/www/cloud (cloud)
#   8104 -> /var/www/api   (api)
#   8105 -> /var/www/robot (robot)
#   8106 -> /var/www/www   (www)
#   8107 -> /var/www/app   (app)
#   8108 -> /var/www/panel (panel)
#
# Dev: http://localhost:8090, :8104, :8105, :8106, :8107.
# Prod: nginx mapea cloud.vigicom.net.ar -> 127.0.0.1:8090,
#       api.vigicom.net.ar -> :8104, robot.vigicom.net.ar -> :8105, etc.
#
# Los Listen viven en ports.conf (no aca) para no chocar con la inclusion
# automatica que hace Apache.

<VirtualHost *:8090>
    ServerName cloud.vigicom.net.ar
    DocumentRoot /var/www/cloud
    <Directory /var/www/cloud>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:8104>
    ServerName api.vigicom.net.ar
    DocumentRoot /var/www/api
    <Directory /var/www/api>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:8105>
    ServerName robot.vigicom.net.ar
    DocumentRoot /var/www/robot
    <Directory /var/www/robot>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:8106>
    ServerName www.vigicom.net.ar
    DocumentRoot /var/www/www
    <Directory /var/www/www>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:8107>
    ServerName app.vigicom.net.ar
    DocumentRoot /var/www/app
    <Directory /var/www/app>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>

<VirtualHost *:8108>
    ServerName panel.vigicom.net.ar
    DocumentRoot /var/www/panel
    <Directory /var/www/panel>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
