; Supervisord administra los tres procesos del contenedor vigicom-robot:
;   - apache: sirve los cronjobs PHP por HTTP en el puerto 80 del contenedor
;             (mapeado al 8091 del host), para poder invocarlos desde el navegador
;   - cron  : dispara los mismos scripts segun horario
;   - motor : daemon Python (long-running) que escucha MQTT y procesa eventos
;
; Logs de los tres van a stdout/stderr de supervisord, que docker captura. Para
; verlos en vivo:
;   docker compose logs -f robot

[program:apache]
command=/usr/local/bin/apache2-foreground
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cron]
command=/usr/sbin/cron -f -L 15
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:motor]
command=python3 /var/www/robot/motor/inicio.py
directory=/var/www/robot/motor
autostart=true
autorestart=true
; Si motor/inicio.py todavia no fue copiado al volume, supervisord reintenta
; muchas veces hasta que aparezca. Una vez corriendo, autorestart lo levanta
; si el proceso muere.
startretries=99
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
